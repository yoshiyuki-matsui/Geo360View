name: 不具合報告
description: Geo360Viewで再現できる問題を報告する
title: "[不具合]: "
labels:
  - 不具合
body:
  - type: markdown
    attributes:
      value: |
        不具合報告ありがとうございます。

        できる範囲で構いませんので、再現手順と環境を教えてください。
        サポートは原則として日本語で行います。英語での報告も歓迎しますが、回答は日本語、または機械翻訳を併記した形になる場合があります。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きましたか？
      placeholder: "問題の内容を簡単に書いてください。"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が起きるまでに行った操作を教えてください。
      placeholder: |
        1. QGISを起動
        2. MP4とGPXを読み込み
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
      description: 本来どう動くことを期待していましたか？
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に何が起きましたか？エラーメッセージがあれば貼り付けてください。
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS / Ubuntu / その他"
    validations:
      required: false

  - type: input
    id: qgis_version
    attributes:
      label: QGISバージョン
      placeholder: "QGIS 3.40.x"
    validations:
      required: false

  - type: input
    id: plugin_version
    attributes:
      label: Geo360Viewバージョン
      placeholder: "0.x.x"
    validations:
      required: false

  - type: input
    id: camera
    attributes:
      label: カメラ機種
      placeholder: "Insta360 X5 / X4 / X3 / その他"
    validations:
      required: false

  - type: input
    id: gpx_source
    attributes:
      label: GPXの出どころ
      placeholder: "Insta360アプリ / GPSリモコン / Garmin / その他"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: 関連するログやスクリーンショットがあれば貼り付け、または添付してください。
    validations:
      required: false
