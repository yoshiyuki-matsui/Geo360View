name: 動作報告
description: Geo360Viewをお手元の360動画とGPXで試した結果を報告する
title: "[動作報告]: "
labels:
  - 動作報告
body:
  - type: markdown
    attributes:
      value: |
        Geo360Viewを試していただきありがとうございます。

        お手元の360動画＋GPXで「動いた／動かなかった」だけでも、とても助かります。
        サポートは原則として日本語で行います。英語での報告も歓迎しますが、回答は日本語、または機械翻訳を併記した形になる場合があります。

  - type: input
    id: camera
    attributes:
      label: カメラ機種
      description: 撮影に使ったカメラ機種を教えてください。
      placeholder: "Insta360 X5 / X4 / X3 / ONE RS / その他"
    validations:
      required: true

  - type: input
    id: gpx_source
    attributes:
      label: GPXの出どころ
      description: GPXファイルをどの機器・アプリ・サービスから取得したか教えてください。
      placeholder: "Insta360アプリ / GPSリモコン / Garmin / スマートフォンアプリ / その他"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: 動作結果
      description: Geo360Viewで表示・同期できましたか？
      options:
        - 動いた
        - 一部動いた
        - 動かなかった
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS / Ubuntu / その他"
    validations:
      required: false

  - type: input
    id: qgis_version
    attributes:
      label: QGISバージョン
      placeholder: "QGIS 3.40.x"
    validations:
      required: false

  - type: input
    id: plugin_version
    attributes:
      label: Geo360Viewバージョン
      placeholder: "0.x.x"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 気づいたこと、エラー内容、スクリーンショット、サンプルデータの特徴などがあればお願いします。
      placeholder: "例: 動画は開けたが、GPXとの同期が約2秒ずれていました。"
    validations:
      required: false
