name: Operation report
description: Report whether Geo360View worked with your camera and GPX data.
title: "[Operation report]: "
labels:
  - operation-report
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying Geo360View.

        Please share the camera model, GPX source, and whether it worked.
        Short reports such as "Insta360 X5 worked" are very helpful.

  - type: input
    id: camera
    attributes:
      label: Camera model
      description: Which camera did you use?
      placeholder: "Insta360 X5 / X4 / X3 / ONE RS / other"
    validations:
      required: true

  - type: input
    id: gpx_source
    attributes:
      label: GPX source
      description: Where did the GPX file come from?
      placeholder: "Insta360 app / GPS remote / Garmin / smartphone app / other"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result
      description: Did Geo360View work with your data?
      options:
        - Worked
        - Partially worked
        - Did not work
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS / Ubuntu / other"
    validations:
      required: false

  - type: input
    id: qgis_version
    attributes:
      label: QGIS version
      placeholder: "QGIS 3.40.x"
    validations:
      required: false

  - type: input
    id: plugin_version
    attributes:
      label: Geo360View version
      placeholder: "0.x.x"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Please add any comments, error messages, screenshots, or sample data notes if available.
      placeholder: "Example: The video opened, but GPX synchronization was shifted by about 2 seconds."
    validations:
      required: false
